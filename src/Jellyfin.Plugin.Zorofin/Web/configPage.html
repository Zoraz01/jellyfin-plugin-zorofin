<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Zorofin</title>
</head>
<body>
    <div id="ZorofinConfigPage" data-role="page" class="page type-interior pluginConfigurationPage zf-page">
        <style>
            #ZorofinConfigPage {
                --zf-bg: #0b0f0d; --zf-panel: #141a17; --zf-raised: #1b231f; --zf-line: rgba(255,255,255,.08);
                --zf-text: #f3f6f4; --zf-muted: #a9b5ad; --zf-faint: #6f7c74;
                --zf-green: #42d779; --zf-green-strong: #25b85f; --zf-green-ink: #041208; --zf-green-soft: rgba(66,215,121,.14);
                --zf-amber: #f2b84b; --zf-amber-soft: rgba(242,184,75,.14); --zf-red: #ff7a6b;
                --zf-radius: 14px;
            }
            #ZorofinConfigPage .zf { box-sizing: border-box; max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; color: var(--zf-text);
                font-family: Inter, "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.45; }
            #ZorofinConfigPage .zf *, #ZorofinConfigPage .zf *::before, #ZorofinConfigPage .zf *::after { box-sizing: border-box; }
            #ZorofinConfigPage .zf-hero { display: flex; align-items: center; gap: 12px; padding: 8px 4px 0; }
            #ZorofinConfigPage .zf-mark { width: 34px; height: 34px; flex: none; }
            #ZorofinConfigPage .zf-hero h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
            #ZorofinConfigPage .zf-hero #zfOverall { margin-left: auto; color: var(--zf-amber); font-size: 14px; font-weight: 600; }
            #ZorofinConfigPage .zf-tabs { display: flex; gap: 26px; margin: 18px 0 24px; padding: 0 4px; border-bottom: 1px solid var(--zf-line);
                overflow-x: auto; scrollbar-width: none; }
            #ZorofinConfigPage .zf-tabs::-webkit-scrollbar { display: none; }
            #ZorofinConfigPage .zf-tab { flex: none; position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 12px 0 13px; border: 0;
                background: transparent; color: var(--zf-muted); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
            #ZorofinConfigPage .zf-tab:hover { color: var(--zf-text); }
            #ZorofinConfigPage .zf-tab[aria-selected="true"] { color: var(--zf-text); }
            #ZorofinConfigPage .zf-tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--zf-green); }
            #ZorofinConfigPage .zf-tab:focus-visible, #ZorofinConfigPage .zf button:focus-visible, #ZorofinConfigPage .zf input:focus-visible,
            #ZorofinConfigPage .zf select:focus-visible { outline: 2px solid var(--zf-green); outline-offset: 2px; }
            #ZorofinConfigPage .zf-step { width: 7px; height: 7px; border-radius: 50%; flex: none; background: transparent; }
            #ZorofinConfigPage .zf-step:not(.ok):not(.warn) { display: none; }
            #ZorofinConfigPage .zf-step.ok { background: var(--zf-green); }
            #ZorofinConfigPage .zf-step.warn { background: var(--zf-amber); }
            #ZorofinConfigPage .zf-panel-intro { margin: 0 4px 16px; }
            #ZorofinConfigPage .zf-panel-intro h2 { margin: 0 0 4px; font-size: 20px; font-weight: 650; }
            #ZorofinConfigPage .zf-panel-intro p { margin: 0; color: var(--zf-muted); max-width: 62ch; }
            #ZorofinConfigPage .zf-card { background: var(--zf-panel); border-radius: var(--zf-radius); padding: 20px; margin-bottom: 12px; }
            #ZorofinConfigPage .zf-card-head { display: flex; align-items: center; gap: 12px; }
            #ZorofinConfigPage .zf-card-head h3 { margin: 0; font-size: 17px; font-weight: 650; }
            #ZorofinConfigPage .zf-card-head p { margin: 2px 0 0; color: var(--zf-muted); font-size: 14px; }
            #ZorofinConfigPage .zf-card-head > div { flex: 1; min-width: 0; }
            #ZorofinConfigPage .zf-card-head > .zf-side { flex: none; display: flex; align-items: center; gap: 12px; }
            #ZorofinConfigPage .zf-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; margin-top: 18px; }
            #ZorofinConfigPage .zf-fields[hidden] { display: none; }
            #ZorofinConfigPage .zf-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
            #ZorofinConfigPage .zf-field.wide, #ZorofinConfigPage .zf-field.check { grid-column: 1 / -1; }
            #ZorofinConfigPage .zf-field > label { font-weight: 600; font-size: 14px; }
            #ZorofinConfigPage .zf-field input[type="text"], #ZorofinConfigPage .zf-field input[type="url"], #ZorofinConfigPage .zf-field input[type="password"],
            #ZorofinConfigPage .zf-field input[type="number"], #ZorofinConfigPage .zf-field select {
                width: 100%; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: var(--zf-bg);
                color: var(--zf-text); font: inherit; font-size: 15px; -webkit-appearance: none; appearance: none; }
            #ZorofinConfigPage .zf-field select { background-image: linear-gradient(45deg, transparent 50%, var(--zf-muted) 50%), linear-gradient(135deg, var(--zf-muted) 50%, transparent 50%);
                background-position: calc(100% - 20px) 19px, calc(100% - 15px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
            #ZorofinConfigPage .zf-field input:focus, #ZorofinConfigPage .zf-field select:focus { border-color: var(--zf-green); outline: none; box-shadow: 0 0 0 3px var(--zf-green-soft); }
            #ZorofinConfigPage .zf-field input::placeholder { color: var(--zf-faint); }
            #ZorofinConfigPage .zf-help { color: var(--zf-muted); font-size: 13px; }
            #ZorofinConfigPage .zf-field textarea, #ZorofinConfigPage .zf-field input[type="datetime-local"] {
                width: 100%; box-sizing: border-box; padding: 11px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: var(--zf-bg);
                color: var(--zf-text); font: inherit; font-size: 15px; color-scheme: dark; }
            #ZorofinConfigPage .zf-field input[type="datetime-local"] { height: 44px; padding-block: 0; }
            #ZorofinConfigPage .zf-field textarea { min-height: 92px; resize: vertical; line-height: 1.45; }
            #ZorofinConfigPage .zf-field textarea:focus, #ZorofinConfigPage .zf-field input[type="datetime-local"]:focus { border-color: var(--zf-green); outline: none; box-shadow: 0 0 0 3px var(--zf-green-soft); }
            #ZorofinConfigPage .zf-count { margin-left: auto; color: var(--zf-faint); font-size: 12px; font-weight: 500; }
            #ZorofinConfigPage .zf-preview { margin-top: 18px; padding: 28px 20px; border-radius: 12px; background: radial-gradient(120% 140% at 80% 0%, #3a2a22 0%, #101512 60%); }
            #ZorofinConfigPage .zf-preview-label { margin: 18px 0 0; color: var(--zf-muted); font-size: 13px; font-weight: 600; }
            #ZorofinConfigPage .zac { max-width: 560px; margin: 0 auto; padding: 22px 26px 24px; color: #f5f7f5; background: #171d19; border: 1px solid rgba(255,255,255,.12); border-radius: 24px; box-shadow: 0 24px 80px rgba(0,0,0,.4); box-sizing: border-box; }
            #ZorofinConfigPage .zac-head { margin: 0 0 18px; font-size: 24px; font-weight: 650; letter-spacing: -.03em; }
            #ZorofinConfigPage .zac-item { padding-top: 20px; border-top: 1px solid rgba(255,255,255,.08); }
            #ZorofinConfigPage .zac-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
            #ZorofinConfigPage .zac-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
            #ZorofinConfigPage .zac-message { margin: 8px 0 0; font-size: 15px; line-height: 1.6; color: #bbc8bf; white-space: pre-wrap; overflow-wrap: anywhere; }
            #ZorofinConfigPage .zac-read { flex-shrink: 0; color: #b8d9c2; font-size: 13px; font-weight: 600; }
            #ZorofinConfigPage .zac-action { display: inline-flex; align-items: center; min-height: 40px; margin-top: 14px; padding: 0 18px; border-radius: 999px; background: #f4f7f5; color: #101512; font-size: 14px; font-weight: 700; white-space: nowrap; }
            #ZorofinConfigPage .zf-field[hidden] { display: none; }
            #ZorofinConfigPage .zf-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
            #ZorofinConfigPage .zf-swatch { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 10px; border-radius: 10px;
                border: 1px solid rgba(255,255,255,.1); background: var(--zf-bg); color: var(--zf-text); font: inherit; font-size: 14px; cursor: pointer; }
            #ZorofinConfigPage .zf-swatch i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
            #ZorofinConfigPage .zf-swatch i.custom { background: conic-gradient(#ff5a5f, #f5a524, #42d779, #3d9cff, #9d7bff, #ff5a5f); }
            #ZorofinConfigPage .zf-swatch[aria-checked="true"] { border-color: var(--zf-text); }
            #ZorofinConfigPage .zf-color { width: 64px; height: 44px; padding: 4px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: var(--zf-bg); cursor: pointer; }
            #ZorofinConfigPage .zf-image { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
            #ZorofinConfigPage .zf-image img { max-width: 200px; max-height: 56px; padding: 8px; border-radius: 10px; background: var(--zf-bg); object-fit: contain; }
            #ZorofinConfigPage .zf-help a, #ZorofinConfigPage .zf-link { color: var(--zf-green); text-decoration: none; font-weight: 600; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; font-size: 13px; }
            #ZorofinConfigPage .zf-help a:hover, #ZorofinConfigPage .zf-link:hover { text-decoration: underline; }
            #ZorofinConfigPage .zf-checkrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 14px;
                border-radius: 10px; background: var(--zf-bg); }
            #ZorofinConfigPage .zf-checkrow span { font-weight: 600; font-size: 14px; }
            #ZorofinConfigPage .zf-switch { position: relative; flex: none; width: 52px; height: 30px; }
            #ZorofinConfigPage .zf-switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
            #ZorofinConfigPage .zf-switch i { position: absolute; inset: 0; border-radius: 999px; background: #39423c; transition: background .15s; }
            #ZorofinConfigPage .zf-switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
            #ZorofinConfigPage .zf-switch input:checked + i { background: var(--zf-green-strong); }
            #ZorofinConfigPage .zf-switch input:checked + i::after { transform: translateX(22px); }
            #ZorofinConfigPage .zf-switch input:disabled { cursor: not-allowed; }
            #ZorofinConfigPage .zf-switch input:disabled + i { opacity: .45; }
            #ZorofinConfigPage .zf-switch input:focus-visible + i { outline: 2px solid var(--zf-green); outline-offset: 2px; }
            #ZorofinConfigPage .zf-muted { color: var(--zf-muted); margin: 4px 0; }
            #ZorofinConfigPage .zf-tickets { display: grid; gap: 12px; margin-top: 12px; }
            #ZorofinConfigPage .zf-ticket h3 { margin: 0; font-size: 16px; }
            #ZorofinConfigPage .zf-ticket.closed { opacity: .7; }
            #ZorofinConfigPage .zf-ticket-text, #ZorofinConfigPage .zf-ticket-reply { white-space: pre-wrap; margin: 8px 0; }
            #ZorofinConfigPage .zf-ticket-reply { color: var(--zf-muted); border-left: 3px solid var(--zf-faint); padding-left: 10px; }
            #ZorofinConfigPage .zf-ticket textarea { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: var(--zf-bg); color: var(--zf-text); font: inherit; font-size: 15px; resize: vertical; }
            #ZorofinConfigPage .zf-chip { font-size: 13px; font-weight: 600; color: var(--zf-faint); white-space: nowrap; }
            #ZorofinConfigPage .zf-chip.ok { color: var(--zf-green); }
            #ZorofinConfigPage .zf-chip.warn { color: var(--zf-amber); }
            #ZorofinConfigPage .zf-notice { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-top: 14px; border-radius: 14px;
                background: var(--zf-amber-soft); color: #fbe3b3; font-size: 14px; }
            #ZorofinConfigPage .zf-notice.info { background: var(--zf-green-soft); color: #c9f5d8; }
            #ZorofinConfigPage .zf-notice .zf-btn { margin-left: auto; }
            #ZorofinConfigPage .zf-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; padding: 16px 0 0; }
            #ZorofinConfigPage .zf-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 20px; border-radius: 10px;
                border: 1px solid rgba(255,255,255,.14); background: transparent; color: var(--zf-text); font: inherit; font-weight: 650; cursor: pointer; }
            #ZorofinConfigPage .zf-btn:hover:not(:disabled) { background: rgba(255,255,255,.06); }
            #ZorofinConfigPage .zf-btn.primary { background: var(--zf-green-strong); border-color: var(--zf-green-strong); color: var(--zf-green-ink); }
            #ZorofinConfigPage .zf-btn.primary:hover:not(:disabled) { background: var(--zf-green); }
            #ZorofinConfigPage .zf-btn.small { height: 34px; padding: 0 14px; font-size: 13px; }
            #ZorofinConfigPage .zf-btn:disabled { opacity: .5; cursor: progress; }
            #ZorofinConfigPage .zf-result { flex-basis: 100%; margin: 4px 0 0; padding: 0; list-style: none; font-size: 14px; }
            #ZorofinConfigPage .zf-result li { display: flex; gap: 8px; padding: 3px 0; color: var(--zf-muted); }
            #ZorofinConfigPage .zf-result li.ok::before { content: "✓"; color: var(--zf-green); font-weight: 800; }
            #ZorofinConfigPage .zf-result li.bad { color: #ffd2cc; }
            #ZorofinConfigPage .zf-result li.bad::before { content: "✕"; color: var(--zf-red); font-weight: 800; }
            #ZorofinConfigPage .zf-result li.busy::before { content: "…"; }
            #ZorofinConfigPage .zf-steps { background: var(--zf-panel); border-radius: var(--zf-radius); overflow: hidden; }
            #ZorofinConfigPage .zf-steprow { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
            #ZorofinConfigPage .zf-steps .zf-steprow + .zf-steprow { border-top: 1px solid var(--zf-line); }
            #ZorofinConfigPage .zf-steprow > div { flex: 1; min-width: 0; }
            #ZorofinConfigPage .zf-steprow strong { display: block; font-size: 15px; }
            #ZorofinConfigPage .zf-steprow small { color: var(--zf-muted); font-size: 13px; }
            #ZorofinConfigPage .zf-next { margin-bottom: 12px; padding: 14px 18px; border-radius: var(--zf-radius); background: var(--zf-raised); }
            #ZorofinConfigPage .zf-explain { margin: 10px 0 0; max-width: 68ch; color: var(--zf-muted); font-size: 14px; }
            #ZorofinConfigPage .zf-explain summary { display: inline-flex; align-items: center; gap: 6px; color: var(--zf-green); font-weight: 600; cursor: pointer; list-style: none; }
            #ZorofinConfigPage .zf-explain summary::-webkit-details-marker { display: none; }
            #ZorofinConfigPage .zf-explain summary::before { content: ""; flex: none; width: 7px; height: 7px; margin: 0 2px 3px 1px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
            #ZorofinConfigPage .zf-explain[open] summary::before { transform: rotate(45deg); margin: 0 2px 5px 1px; }
            #ZorofinConfigPage .zf-explain summary:focus-visible { outline: 2px solid var(--zf-green); outline-offset: 2px; border-radius: 4px; }
            #ZorofinConfigPage .zf-explain-body { margin-top: 8px; padding: 14px 16px; border-radius: 12px; background: var(--zf-panel); }
            #ZorofinConfigPage .zf-explain-body p { margin: 0 0 8px; color: var(--zf-muted); }
            #ZorofinConfigPage .zf-explain-body ul { margin: 0 0 8px; padding-left: 18px; }
            #ZorofinConfigPage .zf-explain-body li { margin: 2px 0; }
            #ZorofinConfigPage .zf-explain-body li strong { color: var(--zf-text); font-weight: 600; }
            #ZorofinConfigPage .zf-explain-body a { color: var(--zf-green); font-weight: 600; text-decoration: none; }
            #ZorofinConfigPage .zf-explain-body a:hover { text-decoration: underline; }
            #ZorofinConfigPage .zf-loading { padding: 48px 0; text-align: center; color: var(--zf-muted); }
            @media (max-width: 640px) {
                #ZorofinConfigPage .zf { padding: 12px 12px 48px; }
                #ZorofinConfigPage .zf-hero h1 { font-size: 22px; }
                #ZorofinConfigPage .zf-tabs { gap: 20px; }
                #ZorofinConfigPage .zf-fields { grid-template-columns: 1fr; }
                #ZorofinConfigPage .zf-card { padding: 16px; }
                #ZorofinConfigPage .zf-card-head { flex-wrap: wrap; }
                #ZorofinConfigPage .zf-actions .zf-btn { flex: 1; }
            }
        </style>

                    { id: 'alerts', title: 'Alerts', section: 'notifications', summary: 'Email or push when a request is ready.', heading: 'Request alerts' },
                    { id: 'channels', title: 'Channels', section: 'liveTvSource', summary: 'Your channel list, event channels and backup guides.', heading: 'Live TV channels', intro: 'Turn your IPTV login or playlist into a small channel list and guide for Jellyfin. Event channels only show while something is on, and backup guides fill any gaps.' },
                    { id: 'livetv', title: 'Live TV', section: 'liveTvGuide', summary: 'A better guide, with artwork and logos.', heading: 'Live TV guide' },
                    { id: 'sports', title: 'Sports', section: 'sportsEvents', summary: 'Real fixtures on your event channels, and Live now.', heading: 'Sports', intro: 'Pick your leagues. Zorofin reads their real schedules, puts each game on the event channel that carries it, hides empty event channels and gives the apps a Live now list.' },
                    { id: 'foryou', title: 'For you', section: 'recommendations', summary: 'Recommended to request, and Popular this week.', heading: 'For you', intro: 'Rows on Home that help viewers find something to watch.' },
                    { id: 'home', title: 'Home', summary: 'Zorofin Home rows, in place of Home Screen Sections.', heading: 'Home', intro: 'Zorofin builds every Home row for each viewer: Continue Watching, their requests, rows picked for them and your library shelves. Empty rows stay hidden. The web client shows them with the Zorofin look on, and the Zorofin apps (1.3 and later) read them from here.' },
                    { id: 'announce', title: 'Announcement', summary: 'A message in everyone\'s Notifications.', heading: 'Announcement', intro: 'A short message for everyone on this server. It shows in Notifications in the web client and the Zorofin apps.' },
                    { id: 'support', title: 'Support', summary: 'Messages from viewers.', heading: 'Support', intro: 'Viewers send you a short message from the Zorofin apps, such as a title that won\'t play. You reply here, and the reply shows in their Notifications.' },
                    { id: 'extras', title: 'Extras', summary: 'Trailers, Calendar, Downloads, ratings, Catch Up.', heading: 'Extras', intro: 'The extras that used to need Media Bar and Jellyfin Enhanced. Each one is off until you turn it on. The web client shows them with the Zorofin look on.' },
                    { id: 'look', title: 'Look & player', section: 'webUi', summary: 'The Zorofin look in Jellyfin\'s web client.', heading: 'Look and player', intro: 'Give Jellyfin\'s own web client the Zorofin look and the Zorofin player. Viewers reload their browser tab to see a change.' }

                    overview: { title: 'How Zorofin fits together', lines: [
                        'Zorofin has two parts. This plugin runs inside Jellyfin. The companion is a small, optional Docker container next to it. Apps only ever talk to Jellyfin, and only show what you turn on here.',
                        '- **Plugin on its own:** Requests, Home rows, Popular this week, the announcement, Support messages and play history.',
                        '- **With the companion:** request alerts, a better Live TV guide, Recommended to request and the Zorofin look on the web.',
                        'Keep these Jellyfin plugins installed alongside Zorofin. It builds on them:',
                        '- **TheTVDB:** show and episode details and artwork.',
                        '- **TheSportsDB:** sports details and artwork for Live TV.',
                        '- **Open Subtitles:** missing subtitles for the apps and player.',
                        '- **Intro Skipper:** Skip Intro and Next Episode.',

                    ] },
                    connect: { lines: [
                        'Fill this in first. Every other tab uses it.',

                        '- **Seerr:** entered once here and used by Requests, alerts and recommendations. Import your Jellyfin users in Seerr first.',
                        'Press Test to check the companion can reach Jellyfin and Seerr. If the companion stops, Jellyfin keeps working and its features switch off.'
                    ] },
                    requests: { lines: [
                        'Viewers browse, search and request, and each request goes to Seerr as that viewer, so their own Seerr permissions, quotas and auto-approval apply.',
                        'Today this works on the web through the Requests hub (Look & player). The Zorofin apps move to it in a coming app update; until then they request through Jellyfin Enhanced, so keep it installed for now.',
                        'Your Seerr, Radarr and Sonarr keys stay on this server. Viewers never see other people\'s requests, emails or file paths.',
                        'A viewer without a Seerr account is told why they can\'t request. Import them in Seerr to fix it.',
                        'The two jobs in "Keep Seerr up to date" only need the Seerr address and key. Turn off Jellyfin Enhanced\'s versions of them at the same time, so nothing is requested twice.'
                    ] },
                    alerts: { lines: [
                        'When a requested title arrives, the viewer who asked gets an email, a push or both. An email address is only used after they confirm a code.',
                        'Coming: the screen where viewers turn alerts on is still being built. Set this up now and alerts start the day it ships.',
                        '- **Email:** your own Resend account.',
                        '- **Push:** your own ntfy server.',

                    ] },
                    livetv: { lines: [
                        'The companion reads your XMLTV guide and hands Jellyfin a better copy: game matchups in titles, posters and matchup cards where art is missing, and logos for channels without one. If your guide source breaks, Jellyfin keeps the last good guide.',
                        'After saving, point Jellyfin at the new guide: Dashboard → Live TV → TV Guide Data Providers → XMLTV, then http://zorofin-companion:9310/v1/public/liveTvGuide/<your token>/guide.xml.',
                        'Each artwork source is optional. With all of them off, nothing leaves your server.'
                    ] },
                    foryou: { lines: [
                        '- **Popular this week** counts minutes watched per title across the server for 35 days. It never stores who watched.',
                        '- **Recommended to request** suggests movies a viewer might want, from what they finished, favorited and requested. It shows once they have finished three movies. Coming: the apps and web don\'t show this row yet.',
                        'AI ranking is optional. With your own key, the AI only reorders the picks and sees titles, never names or emails. If it fails, the standard order is used.'
                    ] },
                    home: { lines: [
                        'Zorofin builds each viewer\'s Home from their own libraries, parental limits and watch history, so the Home Screen Sections plugin isn\'t needed. Empty rows stay hidden.',

                        var c = el('div', 'zac'); c.dataset.type = type;
                        var item = el('div', 'zac-item'), top = el('div', 'zac-top');
                        add(top, el('p', 'zac-title', title || 'Your title'));
                        if (valueOf(items.dismissible)) add(top, el('span', 'zac-read', 'Mark read'));
                        add(item, top, el('p', 'zac-message', message || 'Your message.'));
                        if (label && href) item.appendChild(el('span', 'zac-action', label));
                        add(c, el('p', 'zac-head', 'Notifications'), item);
                        preview.textContent = ''; preview.appendChild(c);
                    }
                    list.forEach(function (item) { item.input.addEventListener('input', draw); item.input.addEventListener('change', draw); });
                    draw();
                    var body = el('div'); add(body, fields, previewLabel, preview);
                    body.hidden = !sw.input.checked;
                    sw.input.addEventListener('change', function () {
                        body.hidden = !sw.input.checked;
                        // Say what saving will do, so the chip never reads "Off" next to a switch that is on.
                        mark.textContent = sw.input.checked ? (p.AnnouncementEnabled ? announcementStatus(p).text : 'On after you save') : (p.AnnouncementEnabled ? 'Off after you save' : 'Off');
                    });
                    box.appendChild(body);
                    panel.appendChild(box);
                    actions(panel, {
                        collect: function () {
                            var want = sw.input.checked, change = {};
                            if (want) {
                                var title = valueOf(items.title), message = valueOf(items.message), label = valueOf(items.label), href = valueOf(items.href);
                                var start = valueOf(items.start), end = valueOf(items.end);
                                if (!title || !message) throw new Error('Add a title and a message, or turn the announcement off.');
                                if ((label && !href) || (href && !label)) throw new Error('A button needs both a label and a link.');
                                if (href && !safeLink(href)) throw new Error('The button link must be a path on this server (starting with /) or an https link.');
                                if (start && end && Date.parse(end) <= Date.parse(start)) throw new Error('The end has to be after the start.');
                            }
                            if (want !== !!p.AnnouncementEnabled) change.AnnouncementEnabled = want;
                            list.forEach(function (item) {
                                var v = valueOf(item), k = item.option.key, was = k === 'AnnouncementDismissible' ? p[k] !== false : (p[k] || (k === 'AnnouncementType' ? 'info' : ''));
                                if (v !== was) change[k] = v;
                            });
                            if (revision !== (p.AnnouncementRevision || 0)) change.AnnouncementRevision = revision;
                            return { plugin: change };
                        }
                    });
                }

                function supportPanel(panel) {
                    var p = state.plugin;
                    var sw = toggle(!!p.SupportInboxEnabled, 'Let viewers message you');
                    var head = el('div', 'zf-side'), mark = chip(p.SupportInboxEnabled ? { kind: 'ok', text: 'On' } : { kind: 'off', text: 'Off' });
                    add(head, mark, sw.wrap);
                    var box = card('Support messages', 'Shows Support in the Zorofin apps. Replies appear in the viewer\'s Notifications.', head);
                    box.dataset.section = 'support';
                    sw.input.addEventListener('change', function () {
                        mark.textContent = sw.input.checked ? (p.SupportInboxEnabled ? 'On' : 'On after you save') : (p.SupportInboxEnabled ? 'Off after you save' : 'Off');
                    });
                    panel.appendChild(box);
                    actions(panel, {
                        collect: function () {
                            return { plugin: sw.input.checked !== !!p.SupportInboxEnabled ? { SupportInboxEnabled: sw.input.checked } : {} };
                        }
                    });
                    var inbox = card('Messages', 'Newest first.');
                    var list = el('div', 'zf-tickets');
                    list.appendChild(el('p', 'zf-muted', 'Loading…'));
                    inbox.appendChild(list);
                    panel.appendChild(inbox);
                    function call(type, path, body) {
                        return ApiClient.ajax({ type: type, url: ApiClient.getUrl(path), contentType: body ? 'application/json' : undefined, data: body ? JSON.stringify(body) : undefined });
                    }
                    function when(value) { var t = Date.parse(value || ''); return isFinite(t) ? new Date(t).toLocaleString() : ''; }
                    function draw(tickets) {
                        list.textContent = '';
                        if (!tickets.length) { list.appendChild(el('p', 'zf-muted', p.SupportInboxEnabled ? 'No messages yet.' : 'No messages. Turn Support on to let viewers write to you.')); return; }
                        tickets.forEach(function (t) {
                            var item = el('article', 'zf-card zf-ticket' + (t.closed ? ' closed' : ''));
                            var meta = (t.userName || 'A viewer') + ' · ' + when(t.createdAt) + (t.closed ? ' · Closed' : '');
                            add(item, el('h3', null, t.issueType + (t.affectedMedia ? ': ' + t.affectedMedia : '')), el('p', 'zf-muted', meta), el('p', 'zf-ticket-text', t.description));
                            if (t.reply) item.appendChild(el('p', 'zf-ticket-reply', 'Your reply' + (t.read ? ' (read)' : '') + ': ' + t.reply));
                            var reply = el('textarea'); reply.maxLength = 1500; reply.rows = 3; reply.placeholder = t.reply ? 'Send a new reply' : 'Write a reply';
                            reply.setAttribute('aria-label', 'Reply to ' + (t.userName || 'this viewer'));
                            reply.className = 'emby-textarea';
                            var bar = el('div', 'zf-actions'), status = el('span', 'zf-muted');
                            var send = el('button', 'zf-btn primary small', 'Send reply'); send.type = 'button';
                            var close = el('button', 'zf-btn small', t.closed ? 'Reopen' : 'Close'); close.type = 'button';
                            var remove = el('button', 'zf-btn small', 'Delete'); remove.type = 'button';
                            send.addEventListener('click', function () {
                                var text = reply.value.trim();
                                if (!text) { status.textContent = 'Write a reply first.'; return; }
                                status.textContent = 'Sending…';
                                call('POST', 'Zorofin/Admin/Support/Tickets/' + t.id + '/Reply', { message: text }).then(refresh, function () { status.textContent = 'Couldn\'t send. Try again.'; });
                            });
                            close.addEventListener('click', function () {
                                call('POST', 'Zorofin/Admin/Support/Tickets/' + t.id + '/Closed?closed=' + (!t.closed)).then(refresh, function () { status.textContent = 'Couldn\'t change it. Try again.'; });
                            });
                            remove.addEventListener('click', function () {
                                if (!window.confirm('Delete this message? This can\'t be undone.')) return;
                                call('DELETE', 'Zorofin/Admin/Support/Tickets/' + t.id).then(refresh, function () { status.textContent = 'Couldn\'t delete. Try again.'; });
                            });
                            add(bar, send, close, remove, status);
                            add(item, reply, bar);
                            list.appendChild(item);
                        });
                    }
                    function refresh() {
                        return request('GET', 'Zorofin/Admin/Support/Tickets').then(function (r) { draw((r && r.tickets) || []); }, function () {
                            list.textContent = ''; list.appendChild(el('p', 'zf-muted', 'Couldn\'t load messages.'));
                        });
                    }
                    refresh();
                }

                // ---- Tabs ----
                function allSteps() {
                    var known = {};
                    STEPS.forEach(function (s) { if (s.section) known[s.section] = true; });
                    known.connections = true;
                    var extra = ((state.companion && state.companion.sections) || []).filter(function (s) { return !known[s.id]; })
                        .map(function (s) { return { id: 'mod-' + s.id, title: s.title, section: s.id, heading: s.title, summary: s.description || '' }; });
                    return STEPS.concat(extra);
                }
                function show(id) {
                    state.tab = id;
                    try { sessionStorage.setItem('zorofin-setup-tab', id); } catch (_) { /* private mode */ }
                    render();
                    var tab = tabsEl.querySelector('[data-tab="' + id + '"]');
                    if (tab) { tab.focus({ preventScroll: true }); if (tab.scrollIntoView) tab.scrollIntoView({ block: 'nearest', inline: 'center' }); }
                }
                function render() {
                    var steps = allSteps();
                    if (!steps.some(function (s) { return s.id === state.tab; })) state.tab = 'overview';
                    tabsEl.textContent = '';
                    steps.forEach(function (s) {
                        var t = el('button', 'zf-tab'); t.type = 'button';
                        t.setAttribute('role', 'tab'); t.dataset.tab = s.id;
                        t.setAttribute('aria-selected', String(s.id === state.tab));
                        t.tabIndex = s.id === state.tab ? 0 : -1;
                        if (s.id !== 'overview') t.appendChild(stepMark(status(s).kind));
                        t.appendChild(el('span', null, s.title));
                        t.addEventListener('click', function () { show(s.id); });
                        tabsEl.appendChild(t);
                    });
                    var counts = steps.filter(function (s) { return s.id !== 'overview'; }).map(status);
                    var warn = counts.filter(function (c) { return c.kind === 'warn'; }).length;
                    var on = counts.filter(function (c) { return c.kind === 'ok'; }).length;
                    var overall = page.querySelector('#zfOverall');
                    // Only speak up when something needs fixing; the Overview tab lists the rest.
                    overall.textContent = warn ? (warn === 1 ? '1 step needs attention' : warn + ' steps need attention') : '';

                    var step = steps.filter(function (s) { return s.id === state.tab; })[0];
                    var panel = el('div', 'zf-panel');
                    panel.setAttribute('role', 'tabpanel');
                    panel.dataset.panel = step.id;
                    var intro = el('div', 'zf-panel-intro');
                    var sec = step.section ? section(step.section) : null;
                    add(intro, el('h2', null, step.id === 'overview' ? 'Your setup' : step.heading || step.title),
                        el('p', null, step.id === 'overview' ? 'Turn on what you want. The apps only show what this server has.' : step.intro || (sec && sec.description) || ''));
                    var note = explainer(step.id);
                    if (note) intro.appendChild(note);
                    panel.appendChild(intro);
                    if (step.id === 'overview') overviewPanel(panel);
                    else if (step.id === 'connect') connectPanel(panel);
                    else if (step.id === 'requests') requestsPanel(panel);
                    else if (step.id === 'foryou') forYouPanel(panel);
                    else if (step.id === 'home') homePanel(panel);
                    else if (step.id === 'look') lookPanel(panel);
                    else if (step.id === 'extras') extrasPanel(panel);
                    else if (step.id === 'announce') announcePanel(panel);
                    else if (step.id === 'support') supportPanel(panel);
                    else modulePanel(panel, step);
                    panelsEl.textContent = '';
                    panelsEl.appendChild(panel);
                }
                tabsEl.addEventListener('keydown', function (e) {
                    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
                    var ids = allSteps().map(function (s) { return s.id; }), i = ids.indexOf(state.tab);
                    show(ids[(i + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length]);
                    e.preventDefault();
                });

                // ---- Loading ----
                function load(quiet) {
                    if (!quiet) Dashboard.showLoadingMsg();
                    return ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        state.plugin = config;
                        if (!config.CompanionUrl || !config.CompanionSecret) { state.companion = null; state.link = 'notset'; return null; }
                        return request('GET', settingsUrl).then(function (view) { state.companion = view; state.link = 'ok'; },
                            function () { state.companion = null; state.link = 'unreachable'; });
                    }).then(function () { if (!quiet) Dashboard.hideLoadingMsg(); }, function (e) { if (!quiet) Dashboard.hideLoadingMsg(); throw e; });
                }

                page.addEventListener('pageshow', function () {
                    try { state.tab = sessionStorage.getItem('zorofin-setup-tab') || 'overview'; } catch (_) { state.tab = 'overview'; }
                    load(false).then(render, function () {
                        panelsEl.textContent = '';
                        panelsEl.appendChild(el('div', 'zf-loading', 'Couldn\'t load the Zorofin settings. Reload the page to try again.'));
                    });
                });
            })();
        </script>
    </div>
</body>
</html>
